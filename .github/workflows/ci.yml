name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: app tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests
        working-directory: app
        run: uv run pytest -q
